# Documentation site, published to GitHub Pages by .github/workflows/docs.yml.
# Preview locally:  uv run --group docs mkdocs serve   (http://127.0.0.1:8000)
#
# Two languages. English pages are `name.md`; a Traditional Chinese page sits
# next to it as `name.zh-TW.md` and is served under /zh-TW/. A page with no
# translation falls back to the English one. Docstrings are English in both.
site_name: CJTrade
site_description: A Python framework for building trading systems for TWSE
site_url: https://jackiesogi.github.io/CJTrade/
repo_url: https://github.com/jackiesogi/CJTrade
repo_name: jackiesogi/CJTrade
edit_uri: edit/master/doc/
docs_dir: doc
strict: true   # a broken link or reference fails the build

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - def_list
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true      # adds the language switcher
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh-TW
          name: 繁體中文
          build: true
          nav_translations:
            Home: 首頁
            Get started: 開始使用
            Install: 安裝
            Key ideas: 基本概念
            Connect to a broker: 連線到券商
            Account and orders: 帳戶與委託
            Market data: 行情資料
            Write a strategy: 撰寫策略
            Backtesting: 回測
            Run the trading engine: 執行交易引擎
            CJShell and FinHub: CJShell 與 FinHub
            Troubleshooting: 疑難排解
            Reference: 參考
            Commands: 指令
            Overview: 總覽
            API reference: API 參考
            Brokers: 券商
            Strategies: 策略
            Analytics: 分析
            Infrastructure: 基礎設施
            Built-in strategies: 內建策略
            Strategy parameters: 策略參數
            Strategy authoring: 策略撰寫
            Loading strategy files: 載入策略檔
            Broker interface: 券商介面
            ArenaX client: ArenaX 用戶端
            Sinopac adapter: 永豐金轉接層
            Models: 資料模型
            Cost model: 交易成本模型
            Risk gate: 風控閘門
            Backtest engine: 回測引擎
            Technical indicators: 技術指標
            Reports: 績效報告
            News: 新聞
            Fundamentals: 基本面
            LLM clients: LLM 用戶端
            Charts: K 線圖
            Configuration and paths: 設定與路徑
            Forms: 表單

  # Each reference page exists once per language, so every object has two
  # URLs; link to the one in the language of the page doing the linking.
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      handlers:
        python:
          # Read the source statically: building the docs never imports
          # cjtrade, so it needs none of its dependencies (ta-lib, shioaji...).
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true

nav:
  - Home: index.md
  - Get started:
      - Install: get-started/install.md
      - Key ideas: get-started/concepts.md
      - Connect to a broker: get-started/connect.md
      - Account and orders: get-started/account-and-orders.md
      - Market data: get-started/market-data.md
      - Write a strategy: get-started/strategy.md
      - Backtesting: get-started/backtesting.md
      - Run the trading engine: get-started/trading-engine.md
      - CJShell and FinHub: get-started/shell-and-finhub.md
      - Troubleshooting: get-started/troubleshooting.md
  - Reference:
      - Commands: reference/commands.md
      - Configuration and paths: reference/config.md
  - API reference:
      - Overview: reference/index.md
      - Brokers:
          - AccountClient: reference/account-client.md
          - Broker interface: reference/broker-base.md
          - ArenaX client: reference/arenax-client.md
          - Sinopac adapter: reference/sinopac.md
      - Strategies:
          - Strategy authoring: reference/strategy-authoring.md
          - Loading strategy files: reference/user-strategy.md
          - BaseStrategy: reference/base-strategy.md
          - Built-in strategies: reference/strategies.md
          - Strategy parameters: reference/strategy-parameters.md
      - Market data: reference/market-data.md
      - Models: reference/models.md
      - Analytics:
          - Backtest engine: reference/backtest-engine.md
          - Cost model: reference/cost-model.md
          - Risk gate: reference/risk.md
          - Technical indicators: reference/technical.md
          - Reports: reference/reports.md
          - News: reference/news.md
          - Fundamentals: reference/fundamentals.md
          - LLM clients: reference/llm.md
          - Charts: reference/charts.md
      - Infrastructure:
          - Forms: reference/forms.md

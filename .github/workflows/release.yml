# Publishes a release when a version tag is pushed:
#
#   git tag -a v1.0.0 -m "v1.0.0" && git push origin v1.0.0
#
# 1. build    builds the sdist and wheel, after checking the tag matches the
#             version in pyproject.toml and that the wheel installs.
# 2. pypi     uploads them to PyPI with Trusted Publishing: PyPI trusts this
#             workflow in this repository, so no API token is stored anywhere.
#             Runs in the `pypi` environment, which can require approval.
# 3. github   creates the GitHub Release for the tag, with notes generated from
#             the merged PRs (grouped by .github/release.yml) and the same files
#             attached.
#
# A tag that does not match pyproject.toml fails at step 1 and publishes
# nothing. PyPI never accepts the same version twice, so a mistake there means
# a new version, not a re-upload.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi
      - run: uv build
      - name: Check the wheel installs and imports
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            python -c "import cjtrade, cjtrade.pkgs.marketdata, cjtrade.apps.CJTrade.main; print(cjtrade.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/cjtrade/
    permissions:
      id-token: write          # Trusted Publishing: proves to PyPI which workflow this is
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"

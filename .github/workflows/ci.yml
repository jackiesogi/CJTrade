# Runs every hook in .pre-commit-config.yaml, one job per hook (the
# whitespace/import hooks share one job), so a red check names what broke.
#
# Secrets (Settings > Secrets and variables > Actions) are needed only by the
# sinopac-shell job, which skips itself when they are absent:
#   SINOPAC_API_KEY, SINOPAC_SECRET_KEY, SINOPAC_CA_CERT_BASE64,
#   SINOPAC_CA_PASSWORD
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every datetime in the codebase is a naive Asia/Taipei value, and market
  # hours are checked against the local clock.
  TZ: Asia/Taipei
  PYTHON_VERSION: "3.12"
  UV_LOCKED: "1"   # fail instead of silently re-resolving if uv.lock is stale

jobs:
  file-hooks:
    name: whitespace, EOF, YAML, import order
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      # Locally these hooks only see the files being committed, and files
      # committed before the hooks existed still fail them. Check the same
      # thing here: the files this push or pull request changed.
      - name: Run the file hooks on the changed files
        env:
          SKIP: readme-examples,unit-tests,ArenaX-broker-integration-test,arenax-shell,sinopac-shell
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # A new branch (before is all zeros) or a manual run: check the
            # commits no other branch on the remote has yet.
            others=$(git for-each-ref --format='%(refname)' refs/remotes/origin \
                     | grep -vx "refs/remotes/origin/${GITHUB_REF_NAME}" \
                     | grep -vx "refs/remotes/origin/HEAD" || true)
            first=$(git rev-list --reverse HEAD --not $others | head -n 1)
            if [ -z "$first" ]; then
              echo "No commits of its own on this branch; nothing to check."
              exit 0
            fi
            base="$(git rev-parse "$first^")"
          fi
          echo "Checking files changed in $base...HEAD"
          uv run pre-commit run --show-diff-on-failure --from-ref "$base" --to-ref HEAD

  readme-examples:
    name: README examples still start
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      - run: uv run python scripts/check_readme_examples.py

  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      - run: >-
          uv run pytest tests/unit/ --tb=short -q
          --cov=src/cjtrade --cov-report=term-missing --cov-report=html:htmlcov/unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: htmlcov/unit
          if-no-files-found: ignore

  arenax-integration:
    name: integration tests (ArenaX)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      # Starts arenaxd (demo backend, prices from yfinance) and stops it again.
      - run: bash tests/run_broker_stability_tests.sh --broker=arenax --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-arenax
          path: |
            htmlcov/integration_arenax
            LAST_BROKER_STABILITY_TEST.log
          if-no-files-found: ignore

  arenax-shell:
    name: shell test (ArenaX)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      # The shell reads API_KEY etc. from a *.cjconf; ArenaX's needs no secret.
      - run: bash scripts/gen_config.sh arenax
      - run: uv run atest --broker=arenax --group=all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-arenax
          path: LAST_CJTRADE_INTEGRATION_TEST.log
          if-no-files-found: ignore

  sinopac-shell:
    name: shell test (Sinopac, simulation)
    # Pull requests from forks get no secrets.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One Sinopac login at a time across all branches.
    concurrency:
      group: sinopac-shell
      cancel-in-progress: false
    env:
      # Never real orders from CI: SIMULATION=y logs in to Sinopac's sandbox.
      # Set here, not from a secret, so no repository setting can turn it off.
      SIMULATION: "y"
      API_KEY: ${{ secrets.SINOPAC_API_KEY }}
      SECRET_KEY: ${{ secrets.SINOPAC_SECRET_KEY }}
      CA_PASSWORD: ${{ secrets.SINOPAC_CA_PASSWORD }}
      CA_CERT_BASE64: ${{ secrets.SINOPAC_CA_CERT_BASE64 }}
    steps:
      - name: Check the Sinopac secrets are set
        id: secrets
        run: |
          if [ -n "$API_KEY" ] && [ -n "$SECRET_KEY" ] && [ -n "$CA_PASSWORD" ] && [ -n "$CA_CERT_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Sinopac secrets are not set; skipping the Sinopac shell test."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.secrets.outputs.present == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - if: steps.secrets.outputs.present == 'true'
        run: uv sync
      - name: Write the CA certificate
        if: steps.secrets.outputs.present == 'true'
        run: |
          umask 077
          printf '%s' "$CA_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/Sinopac.pfx"
          echo "CA_CERT_PATH=$RUNNER_TEMP/Sinopac.pfx" >> "$GITHUB_ENV"
      - if: steps.secrets.outputs.present == 'true'
        run: uv run test --broker=sinopac --group=all
      # No log artifact here: the shell prints account details, and artifacts
      # of a public repository can be downloaded by anyone.
      - name: Remove the CA certificate
        if: always() && steps.secrets.outputs.present == 'true'
        run: rm -f "$RUNNER_TEMP/Sinopac.pfx"

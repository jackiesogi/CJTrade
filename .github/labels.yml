- name: engine
  color: 5319e7
  description: "The CJTrade app: trading engine and bots (apps/CJTrade)"
- name: finhub
  color: 5319e7
  description: "FinHub web UI (apps/FinHub)"
- name: strategy
  color: 5319e7
  description: "Strategies, strategy authoring, strategy-tool, CJEdit"
- name: backtest
  color: 5319e7
  description: "Backtest engine, evaluation reports, oneshot, insight"
- name: risk
  color: b60205
  description: "Pre-trade risk gate"
- name: shell
  color: bfd4f2
  description: "CJShell, the interactive shell (apps/CJShell)"
- name: analytics
  color: bfdadc
  description: "Indicators, fundamentals, news, LLM, charts"
- name: core
  color: bfdadc

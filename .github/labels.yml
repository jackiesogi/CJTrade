# Every label the repository uses, kept in sync by .github/workflows/labels.yml.
#
# Three kinds, told apart by colour:
#   type      what the change is; set from the branch name (type/desc), so it
#             is the PR title's [type] in label form
#   area      which part of the code it touches; set from the changed files
#   the rest  cross-cutting flags: tests, CI, dependencies, real money
#
# The sync creates and updates labels; it never deletes one. Rules for which
# label goes on which pull request live in .github/labeler.yml.

# ── type (branch prefix) ──────────────────────────────────────────────────────
- name: enhancement
  color: a2eeef
  description: "New feature or request (feat/ branches)"
- name: bug
  color: d73a4a
  description: "Something isn't working (fix/ branches)"
- name: documentation
  color: 0075ca
  description: "Docs, READMEs, ref/ notes (docs/ branches or doc files)"
- name: chore
  color: c5def5
  description: "Tooling, cleanup, housekeeping (chore/ branches)"
- name: refactor
  color: d4c5f9
  description: "Code change with no behaviour change (refactor/ branches)"
- name: poc
  color: fef2c0
  description: "Proof of concept, not production code (poc/ branches)"

# ── area (changed files) ──────────────────────────────────────────────────────
- name: arenax
  color: 1d76db
  description: "ArenaX simulated broker: server, backends, its client"
- name: sinopac

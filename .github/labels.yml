# ── flags (changed files) ─────────────────────────────────────────────────────
- name: tests
  color: fbca04
  description: "Adds or changes tests"
- name: ci
  color: ededed
  description: "GitHub workflows, pre-commit hooks"
- name: dependencies
  color: 0366d6
  description: "pyproject.toml or uv.lock"
- name: real-money
  color: e11d21
  description: "Touches code that can place orders on a real account; review with care"

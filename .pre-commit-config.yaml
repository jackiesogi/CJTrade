repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]   # mkdocs.yml uses !!python/name for the Mermaid fence
  - repo: https://github.com/asottile/reorder-python-imports
    rev: v3.19.0
    hooks:
      - id: reorder-python-imports
  - repo: local
    hooks:
      # First, because it is the cheapest way to find out that a documented
      # command no longer starts -- and because a reader hitting that is worse
      # off than having no docs at all. Set CJ_CHECK_NO_SMOKE=1 to keep only
      # the static half, which takes well under a second.
      # Ids are `kind-target` and match the CI job ids in
      # .github/workflows/ci.yml; names say what the hook does.
      - id: "docs-readme"
        name: "Check the README examples still start"
        entry: uv run python scripts/check_readme_examples.py
        language: system
        pass_filenames: false
      - id: "unit"
        name: "Run the unit tests"
        entry: uv run pytest tests/unit/ --tb=short -q --cov=src/cjtrade --cov-report=term-missing --cov-report=html:htmlcov/unit
        language: system
        pass_filenames: false
      - id: "integration-arenax"
        name: "Run the ArenaX API integration tests"
        entry: bash tests/run_broker_stability_tests.sh --broker=arenax --coverage
        language: system
        pass_filenames: false
      - id: "integration-engine"
        name: "Run the CJTrade engine integration tests"
        entry: uv run pytest tests/integration/cjtrade -q
        language: system
        pass_filenames: false
      - id: "integration-cjshell-arenax"
        name: "Run the CJShell integration tests on ArenaX"
        entry: bash tests/test_cjtrade_integration_arenax.sh --broker=arenax --group=all
        language: system
        pass_filenames: false
      # Logs in to the real Sinopac account and places real odd-lot orders.
      - id: "integration-cjshell-sinopac"
        name: "Run the CJShell integration tests on Sinopac (real orders)"
        entry: bash tests/test_cjtrade_integration.sh --broker=sinopac --group=all
        language: system
        pass_filenames: false

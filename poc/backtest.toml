title = "CJTrade OneShot Backtest"

[[field]]
name = "watch_list"
label = "Watch List"
type = "text"
placeholder = "1234"
env_in = "CJSYS_WATCH_LIST"
env_out = "CJSYS_WATCH_LIST"
persist_key = "watch_list"
cli_arg = "--watch-list"

[[field]]
name        = "fund"
label       = "Initial Fund"
type        = "number"
default     = 500000
env_out     = "INITIAL_FUND"
persist_key = "fund"
cli_arg     = "--fund"
[field.config]
min  = 1000
step = 1000

[[field]]
name        = "start_date"
label       = "Start Date (leave blank = random)"
type        = "date"
optional    = true
env_out     = "START_DATE"
persist_key = "start_date"
cli_arg     = "--start"

[[field]]
name        = "days"
label       = "Duration Days"
type        = "number"
default     = 365
env_out     = "DURATION_DAYS"
persist_key = "days"
cli_arg     = "--days"
[field.config]
min = 1

[[field]]
name        = "interval"
label       = "Interval"
type        = "select"
default     = "1d"
env_out     = "INTERVAL"
persist_key = "interval"
cli_arg     = "--interval"
[field.config]
options = ["1m", "5m", "1h", "1d"]

[[field]]
name        = "mode"
label       = "Mode"
type        = "select"
default     = "backtest"
env_out     = "ARENAX_MODE"
persist_key = "mode"
cli_arg     = "--mode"
[field.config]
options = ["backtest", "paper", "demo"]

[[field]]
name = "compare"
label = "Compare Mode"
type = "checkbox"
default = false
env_out = "COMPARE_MODE"
cli_arg = "--compare"

[[field]]
name = "params"
label = "Strategy Params (JSON)"
type = "text"
placeholder = '{"ma":20, "threshold":0.05}'
optional = true
env_out = "PARAMS"
persist_key = "params"
cli_arg = "--params"

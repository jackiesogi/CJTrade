[project]
name = "cjtrade"
version = "0.1.0"
description = "Taiwan stock trading framework: brokers, market data, a simulated exchange and backtesting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Shou-Chi Chen", email = "tuxsogi@gmail.com" }]
keywords = ["trading", "backtesting", "taiwan", "twse", "sinopac", "shioaji", "quant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.13.0",
    "apiflask>=2.2.0",
    "duckdb>=1.4.3",
    "flask>=3.1.2",
    "msgpack>=1.1.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "platformdirs>=4.4.0",
    "plotly>=6.5.1",
    "python-dotenv>=1.1.1",
    "pyzmq>=26.0",
    "quantstats>=0.0.81",
    "requests>=2.32",
    "ta-lib>=0.6.7",
    "toml>=0.10.2",
    "yfinance>=0.2.66",
    "pyreadline3; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/jackiesogi/CJTrade"
Documentation = "https://jackiesogi.github.io/CJTrade/"
Source = "https://github.com/jackiesogi/CJTrade"
Issues = "https://github.com/jackiesogi/CJTrade/issues"

# Integrations that bring in a heavy or vendor-specific SDK. A plain
# `pip install cjtrade` covers ArenaX, backtesting, the shell and reports;
# see src/cjtrade/pkgs/utils/extras.py for how a missing one is reported.
[project.optional-dependencies]
sinopac = ["shioaji>=1.2.8"]
llm = ["google-genai>=1.56.0", "openai>=2.26.0"]
news = ["newsapi-python>=0.2.7"]
all = ["cjtrade[sinopac,llm,news]"]

[project.scripts]
cjshell = "cjtrade.apps.CJShell.cjshell:main"
arenaxd = "cjtrade.apps.ArenaX.brokerside_server:main"
aresh = "cjtrade.apps.ArenaX.brokerside_server_admin_shell:main"
system = "cjtrade.apps.cjtrade_system.system_launcher:main"
backtest = "cjtrade.apps.cjtrade_system.cjtrade_oneshot_backtest:main"
_system_direct = "cjtrade.apps.cjtrade_system.cjtrade_system_arenax:main_system"
strategy-tool = "cjtrade.apps.strategy_tool:main"
insight = "cjtrade.apps.insight:main"
preload-prices = "cjtrade.apps.preload_prices:main"


[tool.pytest.ini_options]
# tests/manual holds scripts that need a real broker and read credentials at
# import time, so it is never collected.
testpaths = ["tests/unit", "tests/integration"]
addopts = "-v --tb=short"
markers = [
    "unit: Pure unit tests, no external dependencies",
    "integration: Requires running external services (ArenaX server, real broker)",
]

[tool.coverage.run]
source = ["src/cjtrade"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
skip_covered = false

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The screenshots beside each app's README are for reading on GitHub; they
# were 3.5 MB of a 3.9 MB wheel. ArenaX/tests holds developer scripts.
wheel-exclude = ["**/img/**", "**/*.png", "cjtrade/apps/ArenaX/tests", "**/*.sh"]

[dependency-groups]
# Contributors get every extra, so `uv sync` in a checkout can run every test
# and every app. Users installing the package do not.
dev = [
    "cjtrade[all]",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
# Pinned below 2: MkDocs 2.0 drops the plugin system mkdocstrings needs.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6",
    "mkdocs-static-i18n>=1.3",
    "mkdocstrings[python]>=0.29",
]
